[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "localagents"
version = "0.1.0"
description = "LocalAgents Harness — an open agent harness for building, running, and composing AI agents, locally or in the cloud."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Harshkumar Bhalodia" }]
keywords = ["agents", "ai", "llm", "agent-harness", "strands"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["strands-agents>=1.0.0", "PyYAML>=6.0"]

[project.optional-dependencies]
ollama = ["strands-agents[ollama]"]
openai = ["strands-agents[openai]"]
bedrock = ["strands-agents[all]"]
tools = ["strands-agents-tools"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/harshbhalodia/localagents"
Issues = "https://github.com/harshbhalodia/localagents/issues"

[tool.hatch.build.targets.wheel]
packages = ["localagents"]

[tool.ruff]
line-length = 120
target-version = "py310"
